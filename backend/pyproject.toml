[project]
name = "oshudh-backend"
version = "0.1.0"
description = "Oshudh Reminder: API server and AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.10",
    "anthropic>=2.14.0",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "google-auth>=2.35",
    "httpx2>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.2",
    "ruff>=0.8",
    "hypothesis>=6.120",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
