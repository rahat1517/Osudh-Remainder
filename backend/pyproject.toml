[project]
name = "oshudh-backend"
version = "0.1.0"
description = "Oshudh Reminder: API server and AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.10",
    "anthropic>=2.14.0",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "google-auth>=2.35",
    "httpx2>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "sentry-sdk[fastapi]>=2.20",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.2",
    "ruff>=0.8",
    "hypothesis>=6.120",
    "astral>=3.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Natural-language content (AI instructions, fixed safety messages) reads better unwrapped
"app/assistant/prompt.py" = ["E501"]
"app/assistant/safety.py" = ["E501"]
"eval/run_assistant_eval.py" = ["E501"]
"app/escalation/engine.py" = ["E501"]
"app/escalation/repository.py" = ["E501"]
"app/training/deid.py" = ["E501"]
"app/prescriptions/local_reader.py" = ["E501"]
"app/main.py" = ["E501"]
"tests/test_training.py" = ["E501"]
"tests/db/test_training_data.py" = ["E501"]
