name: Missed-dose alerts and SMS/call reminders

# Runs the caregiver alert job every 5 minutes. Requires repository secrets:
#   DATABASE_URL          privileged PostgreSQL URL of the Supabase project
#   FCM_SERVICE_ACCOUNT   Firebase service-account JSON (contents)
#   SMS_GATEWAY_URL, SMS_API_KEY, SMS_SENDER_ID, VOICE_GATEWAY_URL, VOICE_API_KEY (optional)
#
# Off by default: set the repository variable ALERTS_ENABLED=true (Settings → Secrets and variables →
# Actions → Variables) to turn it on. While off, the job is skipped and uses no Actions minutes.
# Cost note: every run is billed as at least one minute, so every 5 minutes is ~8,600 min/month. That
# is more than the 2,000 free minutes of a private repository (public repositories are free). Keep the
# 5-minute cadence: feature-phone reminders are only sent within 15 minutes of the dose.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: missed-dose-alerts
  cancel-in-progress: false

jobs:
  alert:
    if: vars.ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL }}
      SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
      SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
      VOICE_GATEWAY_URL: ${{ secrets.VOICE_GATEWAY_URL }}
      VOICE_API_KEY: ${{ secrets.VOICE_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          enable-cache: true
      - name: Run job
        if: steps.config.outputs.enabled == 'true'
        run: |
          uv sync --locked --no-dev
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FCM_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fcm.json"
            export FCM_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/fcm.json"
          fi
          uv run python -m app.caregivers.job
          uv run python -m app.escalation.job
