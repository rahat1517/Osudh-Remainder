name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Drug seed is up to date
        run: |
          uv run python -m app.drugs.importer ../database/seed/drugs_seed.csv --sql /tmp/seed.sql
          diff -u ../supabase/seed.sql /tmp/seed.sql || {
            echo "::error::supabase/seed.sql is stale. Re-run the importer (see database/README.md)."
            exit 1
          }

  ml:
    name: ML data pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t oshudh-api -f backend/Dockerfile .
      - name: Container starts and answers /health
        run: |
          # Production mode needs auth configured; a dummy secret is enough for a health check
          docker run -d --name api -p 8000:8000 \
            -e SUPABASE_JWT_SECRET=ci-only-secret-ci-only-secret-0000 oshudh-api
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: PaddleOCR works inside the image (memory and speed)
        run: |
          docker exec api /srv/backend/.venv/bin/python -c "
          import io, resource, time
          from PIL import Image, ImageDraw, ImageFont
          from app.prescriptions.ocr_reader import OcrPrescriptionReader, RapidOcrEngine
          from app.prescriptions.images import prepare_image
          img = Image.new('RGB', (1200, 500), 'white')
          d = ImageDraw.Draw(img)
          f = ImageFont.load_default(size=34)
          d.text((60, 60), '1. Tab. Seclo 20 mg', fill='black', font=f)
          d.text((60, 140), '1+0+1  khabar age  30 din', fill='black', font=f)
          buf = io.BytesIO(); img.save(buf, format='JPEG')
          t = time.time()
          r = OcrPrescriptionReader(RapidOcrEngine()).read(prepare_image(buf.getvalue()))
          m = r.medicines[0]
          assert (m.name, m.dose_pattern, m.duration_days) == ('Seclo', '1+0+1', 30), r
          mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss // 1024
          print(f'OCR ok in {time.time() - t:.1f}s, peak memory {mb} MB')
          assert mb < 450, 'too much memory for a 512 MB instance'
          "

  database:
    name: Database (migrations and row-level security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Apply migrations and test RLS
        run: uv run pytest tests/db -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  schedule-parity:
    name: Schedule engine parity (Python vs Dart)
    runs-on: ubuntu-latest
    needs: [backend, app]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Export random cases with Python answers
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m scripts.export_schedule_parity --out "$RUNNER_TEMP/parity.json" --count 2000
      - name: Dart must give identical answers
        working-directory: app
        run: |
          flutter pub get
          flutter test test/schedule_parity_test.dart
        env:
          SCHEDULE_PARITY_VECTORS: ${{ runner.temp }}/parity.json

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: oshudh-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
