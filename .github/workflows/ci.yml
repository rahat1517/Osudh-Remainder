name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Drug seed is up to date
        run: |
          uv run python -m app.drugs.importer ../database/seed/drugs_seed.csv --sql /tmp/seed.sql
          diff -u ../supabase/seed.sql /tmp/seed.sql || {
            echo "::error::supabase/seed.sql is stale. Re-run the importer (see database/README.md)."
            exit 1
          }

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  schedule-parity:
    name: Schedule engine parity (Python vs Dart)
    runs-on: ubuntu-latest
    needs: [backend, app]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Export random cases with Python answers
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m scripts.export_schedule_parity --out "$RUNNER_TEMP/parity.json" --count 2000
      - name: Dart must give identical answers
        working-directory: app
        run: |
          flutter pub get
          flutter test test/schedule_parity_test.dart
        env:
          SCHEDULE_PARITY_VECTORS: ${{ runner.temp }}/parity.json

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: oshudh-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
