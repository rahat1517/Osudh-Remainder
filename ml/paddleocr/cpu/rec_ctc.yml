Global:
  debug: false
  use_gpu: false
  distributed: false
  epoch_num: 8
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./rec_output
  save_epoch_step: 1
  eval_batch_step: [0, 600]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  character_dict_path: out/dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 0.5
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 120
    depth: 2
    hidden_dims: 120
    kernel_size: [1, 3]
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 1.0e-05
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /
    label_file_list: [train_abs.txt]
    transforms:
    - DecodeImage: {img_mode: BGR, channel_first: false}
    - RecAug: null
    - CTCLabelEncode: null
    - RecResizeImg: {image_shape: [3, 48, 320]}
    - KeepKeys: {keep_keys: [image, label, length]}
  loader: {shuffle: true, batch_size_per_card: 64, drop_last: true, num_workers: 3}
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /
    label_file_list: [val_abs.txt]
    transforms:
    - DecodeImage: {img_mode: BGR, channel_first: false}
    - CTCLabelEncode: null
    - RecResizeImg: {image_shape: [3, 48, 320]}
    - KeepKeys: {keep_keys: [image, label, length]}
  loader: {shuffle: false, drop_last: false, batch_size_per_card: 128, num_workers: 2}
