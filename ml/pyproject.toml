[project]
name = "oshudh-ml"
version = "0.1.0"
description = "Dataset export and fine-tuning for the self-hosted prescription reader"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx2>=2.16.2",
]

[project.optional-dependencies]
# PaddleOCR data tools: crop export and synthetic lines (CPU is enough)
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "rapidfuzz>=3.10",
    "fonttools>=4.55",
]
# GPU training stack (install on the training machine only)
train = [
    "torch>=2.5",
    "transformers>=4.50",
    "peft>=0.14",
    "trl>=0.15",
    "datasets>=3.2",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pillow>=11", "rapidfuzz>=3.10", "fonttools>=4.55"]

[tool.uv]
package = false
# rapidocr-onnxruntime asks for the GUI build of OpenCV; the headless build provides the same cv2
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Generated from oshudh_ml/synth_rec.py and paddleocr/train_rec_colab.sh, which are checked
extend-exclude = ["paddleocr/*.ipynb"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"oshudh_ml/dataset.py" = ["E501"]
"oshudh_ml/train_lora.py" = ["E501"]
"tests/*.py" = ["E501"]
"oshudh_ml/synth_rec.py" = ["E501"]
"oshudh_ml/export_rec.py" = ["E501"]
"paddleocr/make_colab_notebook.py" = ["E501"]
