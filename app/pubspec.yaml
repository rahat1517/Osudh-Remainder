name: oshudh_reminder
description: "Oshudh Reminder: reads prescriptions and reminds patients to take their medicines on time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri_400Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri_500Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri_700Bold.ttf
          weight: 700
