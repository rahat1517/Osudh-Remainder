name: oshudh_reminder
description: "Oshudh Reminder: reads prescriptions and reminds patients to take their medicines on time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  android_intent_plus: ^6.1.0
  audioplayers: ^6.8.1
  device_info_plus: ^13.3.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Recorded voice lines for the alarm screen (see lib/alarms/voice.dart)
  assets:
    - assets/voice/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri_400Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri_500Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri_700Bold.ttf
          weight: 700
