name: oshudh_reminder
description: "Oshudh Reminder: reads prescriptions and reminds patients to take their medicines on time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  android_intent_plus: ^6.1.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri_400Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri_500Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri_700Bold.ttf
          weight: 700
